name: Nightly suite

# The customer's own schedule. The triage loop starts from the job events this
# produces — Sauce Verify owns no scheduler.
on:
  schedule:
    # 09:30 UTC = 15:00 IST. Deliberately a working-hour slot, not the middle
    # of the night: the triage agent has to be reachable when these jobs
    # finish, or Sauce delivers 48 webhooks into a black hole and the run
    # produces grid minutes and no verdicts. Move this back to a real
    # overnight slot once the receiver is deployed somewhere always-on.
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      # Sauce Verify dispatches this workflow and then has to find the jobs it
      # started. GitHub's dispatch API returns NO run id, so `github.run_id` —
      # which the schedule path uses below — cannot be known by the caller.
      # The agent therefore mints a tag, passes it here, and polls Sauce for
      # that build. Without this input a dispatched run is invisible to it.
      build_tag:
        description: "Build tag to report to Sauce (Verify sets this; leave blank for a manual run)"
        required: false
        type: string
      variant:
        description: "Which injected defect to run with"
        required: false
        default: all
        type: choice
        options: [all, none, app, flaky, selector, submit, toggle]

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A scheduled run exercises every injected defect. A run started from
        # the dashboard usually wants ONE, because the point is to see a
        # result quickly — so the input narrows the matrix rather than being
        # declared and ignored.
        variant: ${{ fromJSON((github.event_name == 'schedule' || inputs.variant == '' || inputs.variant == 'all') && '["none","app","flaky","selector","submit"]' || format('["{0}"]', inputs.variant)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # saucectl is installed by tag, straight from the release download URL.
      # The saucectl-run-action resolved "latest" through the GitHub API with
      # no token, and on a busy shared runner that call is rate-limited — the
      # action then logged the error and still reported SUCCESS with zero
      # Sauce jobs (seen 30 Sep and 1 Oct). A failed install here is a red job.
      - name: Install saucectl
        run: curl -fsSL https://saucelabs.github.io/saucectl/install | sudo bash -s -- -b /usr/local/bin v0.205.1

      - name: Run suite on Sauce
        # Variants other than `none` fail on purpose; the triage agent is the
        # consumer of those failures, so a red suite must not fail the job.
        continue-on-error: true
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          # The Backtrace submission token rides on the URL rather than living in
          # app/telemetry.config.js: this repo is PUBLIC, and the token is a write
          # credential for a project in Sauce's internal Backtrace tenant. With the
          # secret unset the suites still run and telemetry is simply off.
          BASE_URL: ${{ vars.BASE_URL }}${{ secrets.BACKTRACE_SUBMISSION_TOKEN && format('?bt={0}', secrets.BACKTRACE_SUBMISSION_TOKEN) || '' }}
          VARIANT: ${{ matrix.variant }}
          COMMIT_SHA: ${{ github.sha }}
          # A dispatched run carries the tag the caller chose; a scheduled
          # one has no caller, so it falls back to the run id as before.
          BUILD_TAG: ${{ inputs.build_tag && format('{0}-{1}', inputs.build_tag, matrix.variant) || format('nightly-{0}-{1}', github.run_id, matrix.variant) }}
        run: saucectl run --config .sauce/config.yml

  # ATT-91 — the AI Authoring suite (Lane B). Its cases were recorded once on the
  # healthy /verify/ page and replay the selectors they saw, so the defect cannot
  # ride on the URL: this job deploys the night's variant to /verify/variant.json,
  # waits until Pages serves it, then runs the suite under a build tag the agent
  # can find. One variant per night — a single URL serves one app at a time.
  ai-suite:
    if: vars.VERIFY_SUITE_ID != '' && (github.event_name == 'schedule' || inputs.variant == '' || contains(fromJSON('["all","none","app","selector","toggle"]'), inputs.variant))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    # Shares Pages with pages.yml; never cancel a deploy the suite is waiting on.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Choose the variant
        id: variant
        run: |
          if [ -n "${{ inputs.variant }}" ] && [ "${{ inputs.variant }}" != "all" ]; then
            v="${{ inputs.variant }}"
          else
            # Rotate by day of year, so four nights cover all four. `toggle`
            # (9 Oct) is a Test bug that looks like the refused save: the
            # measured record needs both answers before a model may decide.
            vs=(none selector app toggle); v="${vs[$(( 10#$(date -u +%j) % 4 ))]}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "{\"bug\": \"$v\"}" > app/verify/variant.json
          echo "variant for /verify/: $v"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
        # GitHub sometimes loses the just-uploaded artifact's metadata for a
        # moment ("No artifacts named github-pages were found" / "Fetching
        # artifact metadata failed") — 5 Oct, twice on 6 Oct, one of them the
        # nightly. The artifact IS there; a second deploy a little later works.
        continue-on-error: true
      - name: Retry the Pages deploy once
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Wait until /verify/ serves the variant
        run: |
          url="${{ vars.BASE_URL }}"; url="${url%/}/verify/variant.json"
          for i in $(seq 1 60); do
            if curl -fsS "$url?t=$(date +%s)" | grep -q "\"${{ steps.variant.outputs.value }}\""; then
              echo "live after ${i}x5s"; exit 0
            fi
            sleep 5
          done
          echo "::error::/verify/ never served variant ${{ steps.variant.outputs.value }}"; exit 1

      - name: Run the suite
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          # Same tag scheme as the Playwright jobs, so the agent's run tracking
          # (prefix match on the tag it minted) sees both suites as one run.
          BUILD_TAG: ${{ inputs.build_tag && format('{0}-ai-{1}', inputs.build_tag, steps.variant.outputs.value) || format('nightly-{0}-ai-{1}', github.run_id, steps.variant.outputs.value) }}
        run: |
          body=$(printf '{"buildName": "%s"}' "$BUILD_TAG")
          reply=$(curl -sS -w '\n%{http_code}' -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
            -H 'Content-Type: application/json' -d "$body" \
            "https://api.us-west-1.saucelabs.com/v1/ai-authoring/testsuites/${{ vars.VERIFY_SUITE_ID }}/run")
          code=$(echo "$reply" | tail -1); echo "$reply" | head -1
          [ "$code" = "200" ] || { echo "::error::suite run answered $code"; exit 1; }
