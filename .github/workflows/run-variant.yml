name: Run one variant

# Manual entry point, and the one the triage agent calls when it reruns a
# single failing suite.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which defect to exhibit
        type: choice
        required: true
        default: none
        options: [none, app, flaky, selector, submit, render]
      suite:
        description: Single saucectl suite to run, e.g. add-chromium. Empty runs all.
        type: string
        required: false
        default: ''

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Run suite on Sauce
        # The suite is MEANT to fail for every variant but `none` — the triage
        # agent is the consumer of those failures. The action has no
        # ignore-failure input (measured 15 Sept: it warns "Unexpected
        # input(s) 'sauce-ignore-failure'"), so this is the GitHub-native way.
        continue-on-error: true
        uses: saucelabs/saucectl-run-action@v4
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          # The Backtrace submission token rides on the URL rather than living in
          # app/telemetry.config.js: this repo is PUBLIC, and the token is a write
          # credential for a project in Sauce's internal Backtrace tenant. With the
          # secret unset the suites still run and telemetry is simply off.
          BASE_URL: ${{ vars.BASE_URL }}${{ secrets.BACKTRACE_SUBMISSION_TOKEN && format('?bt={0}', secrets.BACKTRACE_SUBMISSION_TOKEN) || '' }}
          VARIANT: ${{ inputs.variant }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_TAG: manual-${{ github.run_id }}-${{ inputs.variant }}
        with:
          # `select-suite` is the real input name; `sauce-args` is not one.
          select-suite: ${{ inputs.suite }}
