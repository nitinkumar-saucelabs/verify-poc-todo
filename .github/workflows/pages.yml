name: Deploy app to Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      # Sauce Verify's Runs → Plant: the bug /verify/ serves to the AI Authoring
      # tests recorded there, until another is planted. A push deploys the
      # committed variant.json ("none").
      variant:
        description: Bug the /verify/ page plants
        type: choice
        options: [none, selector, submit, app, flaky]
        default: none

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Plant the bug /verify/ serves
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "{\"bug\": \"${{ inputs.variant }}\"}" > app/verify/variant.json
          cat app/verify/variant.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
