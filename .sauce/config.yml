apiVersion: v1alpha
kind: playwright
sauce:
  region: us-west-1
  concurrency: 6
  metadata:
    # BUILD_TAG and COMMIT_SHA are injected by CI. COMMIT_SHA is the POC's
    # miniature of HLD decision D9: every job carries what a rerun needs.
    build: $BUILD_TAG
    tags:
      - verify-poc
      - variant:$VARIANT
      - commit:$COMMIT_SHA
playwright:
  version: package.json
  configFile: playwright.config.js
rootDir: ./
# One suite per spec per browser. The suite name is what the triage agent
# passes to `saucectl run --select-suite <name>` when it reruns a failure,
# so it must stay stable and unique.
#
# Every suite carries `env`. saucectl does NOT forward the machine's
# environment to the remote run, so without this the tests execute on the
# Sauce VM with BASE_URL unset (falling back to localhost:8080, which is
# nothing there) and VARIANT defaulting to `none` — a HEALTHY app. The
# deliberate defect would vanish, the test would pass, and triage would read
# that pass as "not deterministic, therefore FLAKE".
#
# Firefox runs on macOS, Chromium on Windows. That asymmetry is not a
# preference — MEASURED 24 Sept 2026: Playwright 1.62.1 bundles Firefox 153,
# which links msvcp140_1.dll, and that DLL is absent from BOTH Sauce Windows
# images. Every Firefox job died before the browser opened:
#
#   Error: browserType.launch: Host system is missing dependencies!
#     msvcp140_1.dll
#
# It cost 42 of 46 nightly defects and 82 wasted rerun jobs before anyone
# noticed, because an unlaunched browser looks like an untriageable failure.
# Sauce advertises playwright-firefox on Windows 10 and 11 for this version;
# it does not work on either. Chromium is unaffected — it bundles its own
# runtime. Move Firefox back once the Windows image ships the redistributable.
suites:
  - name: add-chromium
    platformName: "Windows 11"
    testMatch: ["tests/add.spec.js"]
    params: { browserName: chromium, project: chromium }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT
  - name: add-firefox
    platformName: "macOS 14"
    testMatch: ["tests/add.spec.js"]
    params: { browserName: firefox, project: firefox }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT

  - name: complete-chromium
    platformName: "Windows 11"
    testMatch: ["tests/complete.spec.js"]
    params: { browserName: chromium, project: chromium }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT
  - name: complete-firefox
    platformName: "macOS 14"
    testMatch: ["tests/complete.spec.js"]
    params: { browserName: firefox, project: firefox }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT

  - name: delete-chromium
    platformName: "Windows 11"
    testMatch: ["tests/delete.spec.js"]
    params: { browserName: chromium, project: chromium }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT
  - name: delete-firefox
    platformName: "macOS 14"
    testMatch: ["tests/delete.spec.js"]
    params: { browserName: firefox, project: firefox }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT

  - name: filter-chromium
    platformName: "Windows 11"
    testMatch: ["tests/filter.spec.js"]
    params: { browserName: chromium, project: chromium }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT
  - name: filter-firefox
    platformName: "macOS 14"
    testMatch: ["tests/filter.spec.js"]
    params: { browserName: firefox, project: firefox }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT

  - name: persist-chromium
    platformName: "Windows 11"
    testMatch: ["tests/persist.spec.js"]
    params: { browserName: chromium, project: chromium }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT
  - name: persist-firefox
    platformName: "macOS 14"
    testMatch: ["tests/persist.spec.js"]
    params: { browserName: firefox, project: firefox }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT

  - name: empty-chromium
    platformName: "Windows 11"
    testMatch: ["tests/empty.spec.js"]
    params: { browserName: chromium, project: chromium }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT
  - name: empty-firefox
    platformName: "macOS 14"
    testMatch: ["tests/empty.spec.js"]
    params: { browserName: firefox, project: firefox }
    env:
      BASE_URL: $BASE_URL
      VARIANT: $VARIANT

artifacts:
  download:
    when: always
    match:
      - "*.json"
      - "*.log"
      # The DOM the suite attaches on failure (tests/fixtures.js). Pulled back
      # so a heal can be checked by hand against the same page the agent saw.
      - "*.html"
    directory: ./artifacts/

reporters:
  spotlight:
    enabled: true
