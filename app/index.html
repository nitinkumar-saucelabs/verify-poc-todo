<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Todo — Sauce Verify POC</title>
<link rel="stylesheet" href="style.css">
<script>
  // A page deployed by the lifecycle's script has build-info.json beside it
  // ({environment, commit, deployed_at}); telemetry reports both on every crash.
  // Synchronous so it is on <html> before the module runs, and without a
  // cache-buster so it ages with app.js at the Pages edge. A missing or
  // non-JSON file means no attributes.
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'build-info.json', false);
    xhr.send();
    if (xhr.status === 200) {
      var info = JSON.parse(xhr.responseText);
      if (info && typeof info.environment === 'string') document.documentElement.dataset.environment = info.environment;
      if (info && typeof info.commit === 'string') document.documentElement.dataset.commit = info.commit;
    }
  } catch (e) { /* no build-info: nothing to report */ }
</script>
</head>
<body>
  <main class="app">
    <h1>Todo</h1>
    <p class="variant" data-testid="variant-banner"></p>

    <form class="new" data-testid="new-form">
      <input data-testid="new-input" autocomplete="off" placeholder="What needs doing?" aria-label="New todo">
      <button type="submit" data-testid="add-button">Add</button>
    </form>

    <p class="error" data-testid="error" hidden></p>

    <ul class="list" data-testid="todo-list"></ul>

    <p class="empty" data-testid="empty-state" hidden>Nothing here yet.</p>

    <footer class="filters">
      <button data-testid="filter-all" data-filter="all">All</button>
      <button data-testid="filter-active" data-filter="active">Active</button>
      <button data-testid="filter-completed" data-filter="completed">Completed</button>
      <span data-testid="count"></span>
    </footer>
  </main>
  <!-- A module, so it can import the vendored Backtrace SDK. Deferred by
       definition, so the DOM is complete when init() runs — same timing as
       the classic script at the end of <body> it replaces. -->
  <script type="module" src="app.js"></script>
</body>
</html>
